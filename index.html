<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101114"><title>Webová liga — Súťaž o najlepší web</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#191a20;--line:#30313a;--text:#f5f4f1;--muted:#a6a6b0;--lime:#c8fa65;--max:1100px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(var(--max),calc(100% - 32px));margin:auto}.top{height:70px;border-bottom:1px solid #ffffff15;display:flex;align-items:center}.nav{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:850;font-size:19px;text-decoration:none;color:white}.brand i{font-style:normal;background:var(--lime);color:#171912;border-radius:9px;padding:5px 9px;margin-right:8px}.btn{border:0;border-radius:999px;background:var(--lime);color:#171912;font-weight:800;text-decoration:none;padding:10px 15px;cursor:pointer;display:inline-block}.btn.secondary{background:#33343a;color:white}.btn:disabled{opacity:.55;cursor:default}.hero{padding:55px 0 30px}.tag{color:var(--lime);font-weight:800;font-size:12px;letter-spacing:.13em;text-transform:uppercase}.hero h1{font-size:clamp(42px,8vw,72px);letter-spacing:-.075em;line-height:.98;margin:15px 0}.hero h1 span{color:var(--lime)}.hero p,.muted{color:var(--muted)}.hero p{max-width:620px}.section{padding:28px 0 50px}.heading{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:18px}.heading h2{font-size:clamp(26px,4vw,38px);letter-spacing:-.05em;line-height:1.05;margin:7px 0 0}.muted{font-size:13px}.entries{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}.preview{display:block;height:205px;background:#fff;position:relative}.preview iframe{display:block;width:100%;height:100%;border:0;pointer-events:none;background:#fff}.rank{position:absolute;top:10px;left:10px;background:#101114df;border-radius:8px;padding:4px 9px;font-size:12px;z-index:1}.details{padding:15px}.details h3{margin:0}.author,.desc{font-size:13px}.author{color:var(--muted)}.desc{color:#c5c5cc;min-height:36px}.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid #ffffff14;padding-top:12px}.route-link{color:var(--lime);font-size:12px;font-weight:700;text-decoration:none}.empty{grid-column:1/-1;border:1px dashed #454650;border-radius:18px;padding:32px;text-align:center;color:var(--muted)}.empty b{display:block;color:white}.submit{background:#16171b;border-top:1px solid #ffffff12;padding:45px 0}.submit-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:30px;align-items:start}.submit h2{font-size:clamp(32px,5vw,43px);letter-spacing:-.06em;line-height:1;margin:12px 0}.submit-copy p{color:var(--muted)}.form{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}.field{display:grid;gap:7px;margin-top:13px}.field label{font-size:13px;font-weight:700}.field input,.field textarea{width:100%;border:1px solid #383941;border-radius:10px;background:#111216;color:white;padding:11px;font:inherit}.field textarea{min-height:180px;resize:vertical;font:13px/1.5 ui-monospace,Consolas,monospace}.help{font-size:11px;color:var(--muted)}.form-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px}.form-bottom small{font-size:11px;color:var(--muted)}.winner-box{border:1px solid #c8fa6540;background:#1c2118;border-radius:18px;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:15px}.winner-box h3{margin:0}.winner-box p{margin:6px 0 0;color:var(--muted);font-size:13px}.detail-preview{height:min(75vh,800px);min-height:400px;border:1px solid var(--line);border-radius:15px;overflow:hidden;background:white}.detail-preview iframe{width:100%;height:100%;border:0}.detail-info{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:18px 0}.back{color:var(--lime);font-weight:700;text-decoration:none}.clean-preview{overflow:hidden;background:white}.clean-preview .top,.clean-preview .footer{display:none}.clean-preview #app{width:100%;max-width:none;margin:0}.clean-frame{display:block;width:100%;height:100dvh;border:0;background:white}.clean-message{min-height:100vh;display:grid;place-content:center;background:#101114;text-align:center;padding:24px}.clean-message a{color:var(--lime)}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;background:#f4f3ef;color:#171815;border-radius:10px;padding:11px 15px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:720px){.submit-grid{grid-template-columns:1fr}.heading{align-items:flex-start;flex-direction:column}.form-bottom{align-items:flex-start;flex-direction:column}}@media(max-width:480px){.wrap{width:calc(100% - 26px)}.form{padding:15px}.winner-box{align-items:flex-start;flex-direction:column}}</style></head>
<body><header class="top"><div class="wrap nav"><a class="brand" href="./"><i>W</i>webová liga</a><a class="btn" href="./vyherca">🏆 Víťaz</a></div></header><main class="wrap" id="app"></main><footer class="footer"><div class="wrap">Webová liga © 2025 by najlepší web.</div></footer><div class="toast" id="toast" role="status"></div>
<script>
(()=>{
const DATA='webova-liga-html-v2',SET='webova-liga-settings-v1',REPO='/sutaz-html';
const forwarded=new URLSearchParams(location.search).get('route');if(forwarded)history.replaceState({},'',forwarded);
let path=location.pathname;const base=path===REPO||path.startsWith(REPO+'/')?REPO:'',root=base+'/',app=document.getElementById('app');
const monday=new Date();monday.setHours(0,0,0,0);monday.setDate(monday.getDate()-((monday.getDay()+6)%7));const defaultKey=dateKey(monday);
function dateKey(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function read(){try{return JSON.parse(localStorage.getItem(DATA))||{entries:[],votes:{}}}catch{return{entries:[],votes:{}}}}
function write(d){try{localStorage.setItem(DATA,JSON.stringify(d));return true}catch{return false}}
function settings(){try{return JSON.parse(localStorage.getItem(SET))||{}}catch{return{}}}
function saveSettings(s){try{localStorage.setItem(SET,JSON.stringify(s));return true}catch{return false}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]))}
function slug(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,48)||'web'}
function roundKey(){return settings().roundKey||defaultKey}
function endAt(){const n=Number(settings().endAt);return Number.isFinite(n)&&n>0?n:null}
function notify(message){const t=document.getElementById('toast');t.textContent=message;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function route(){let p=location.pathname;if(base&&p.startsWith(base))p=p.slice(base.length);return decodeURIComponent(p.replace(/^\/+|\/+$/g,''))}
function urlFor(e){return root+encodeURIComponent(e.slug)}
// Sandboxed site previews cannot close their browser tab. Make window.close() close only
// that submitted preview, and keep the parent competition page under our control.
function previewDocument(html){
  const bridge=`<script>
    (function(){
      const closePreview = function(){
        try { parent.postMessage({ type: 'web-liga:close-preview' }, '*'); }
        catch (e) {}
      };
      try {
        Object.defineProperty(window, 'close', {
          value: closePreview,
          writable: false,
          configurable: false
        });
      } catch (e) {
        window.close = closePreview;
      }
    })();
  <\/script>`;
  if (/<head\b/i.test(html)) return html.replace(/<head\b[^>]*>/i, match => match + bridge);
  if (/<body\b/i.test(html)) return html.replace(/<body\b[^>]*>/i, match => bridge + match);
  return bridge + html;
}
function showPreviewClosed(frame){
  frame.srcdoc='<!doctype html><html lang="sk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><body style="margin:0;min-height:100vh;display:grid;place-content:center;text-align:center;font:16px/1.5 system-ui;background:#f5f5f5;color:#222"><main><h2>🚫 Náhľad zatvorený</h2><p>Tento HTML web bol zatvorený.</p></main></body></html>';
}
addEventListener('message',event=>{if(event.data?.type!=='web-liga:close-preview')return;for(const frame of document.querySelectorAll('iframe'))if(frame.contentWindow===event.source){showPreviewClosed(frame);break}});
function pickWinner(d){const s=settings(),end=endAt();if(s.winnerId&&s.winnerRoundKey===roundKey())return d.entries.find(e=>e.id===s.winnerId)||null;if(!end||Date.now()<end)return null;const top=d.entries.filter(e=>e.week===roundKey()).sort((a,b)=>(Number(b.votes)||0)-(Number(a.votes)||0));return top[0]||null}
function render(){const d=read(),r=route(),win=pickWinner(d),end=endAt(),closed=!!end&&Date.now()>=end;
if(r==='vyherca'){document.title=win?`${win.title} — Víťaz`:'Čakáme na víťaza';document.body.classList.add('clean-preview');app.innerHTML=win?`<iframe class="clean-frame" title="Čistý náhľad" sandbox="allow-scripts allow-forms allow-popups"></iframe>`:`<div class="clean-message"><div><h1>📣 Čakáme na víťaza</h1><p>Výsledok sa objaví po skončení hlasovania.</p><a href="${root}">Späť na súťaž</a></div></div>`;if(win)app.querySelector('iframe').srcdoc=previewDocument(win.html);return}
const requested=r?d.entries.find(e=>e.slug===r):null,isClean=new URLSearchParams(location.search).get('preview')==='1';
if(requested&&isClean){document.body.classList.add('clean-preview');document.title=requested.title;app.innerHTML='<iframe class="clean-frame" title="Čistý náhľad" sandbox="allow-scripts allow-forms allow-popups"></iframe>';app.querySelector('iframe').srcdoc=previewDocument(requested.html);return}
document.body.classList.remove('clean-preview');
if(requested){document.title=requested.title+' — Webová liga';app.innerHTML=`<section class="section"><a class="back" href="${root}">← Späť na súťaž</a><div class="detail-info"><div><div class="tag">HTML web</div><h1>${esc(requested.title)}</h1></div><div class="detail-actions"><a class="btn secondary" href="${urlFor(requested)}?preview=1" target="_blank" rel="noopener">Náhľad</a><button class="btn" data-vote="${esc(requested.id)}" ${closed?'disabled':''}>${closed?'Hlasovanie skončilo':'Hlasovať'}</button></div></div><div class="detail-preview"><iframe title="${esc(requested.title)}" sandbox="allow-scripts allow-forms allow-popups"></iframe></div></section>`;app.querySelector('.detail-preview iframe').srcdoc=previewDocument(requested.html);app.querySelector('[data-vote]').onclick=()=>vote(requested.id);return}
const entries=d.entries.filter(e=>e.week===roundKey()).sort((a,b)=>(Number(b.votes)||0)-(Number(a.votes)||0));const countdown=end?`Do konca hlasovania: ${timeLeft(end)}`:'Časovač sa spustí po prihlásení prvého webu';
app.innerHTML=`<section class="hero"><div class="tag">● Týždenná súťaž webov</div><h1>Vlož svoj web.<br><span>Vyhraj týždeň.</span></h1><p>Prihlás HTML projekt, nechaj komunitu hlasov a zvíťazí ten najsilnejší návrh.</p><a class="btn" href="#sutaz">Zúčastniť sa</a></div></section><section class="section" id="sutaz"><div class="heading"><div><div class="tag">Hlasovanie</div><h2>Weby v tomto kole</h2></div><div class="muted" id="countdown">${countdown}</div></div><div class="entries">${entries.length?entries.map((e,i)=>`<article class="card"><div class="preview"><span class="rank">#${i+1}</span><iframe title="${esc(e.title)}" sandbox="allow-scripts allow-forms allow-popups"></iframe></div><div class="details"><h3>${esc(e.title)}</h3><div class="author">od ${esc(e.creator)}</div><p class="desc">${esc(e.description)}</p><div class="card-foot"><span class="muted"><b>${Number(e.votes)||0}</b> hlasov</span><a class="route-link" href="${urlFor(e)}">Otvoriť web</a></div></div></article>`).join(''):'<div class="empty"><b>Zatiaľ nie je prihlásený žiadny web.</b>Prvá stránka spustí hlasovanie a časovač.</div>'}</div></section><section class="submit"><div class="submit-grid"><div class="submit-copy"><div class="tag">Pridať web</div><h2>Prihlas svoj HTML projekt</h2><p>Táto aplikácia uloží web do lokálneho úložiska prehliadača. Pre správny náhľad použite validný HTML dokument.</p></div><form class="form" id="form"><div class="field"><label for="title">Názov projektu *</label><input id="title" name="title" required maxlength="50"></div><div class="field"><label for="creator">Autor *</label><input id="creator" name="creator" required maxlength="40"></div><div class="field"><label for="description">Krátky popis *</label><input id="description" name="description" required maxlength="120"></div><div class="field"><label for="html">HTML kód *</label><textarea id="html" name="html" maxlength="1000000" placeholder="<!doctype html><html>..." required></textarea><span class="help">Najväčší povolený súbor je 1 MB. Pre názov náhľadu používajte plný HTML dokument.</span></div><div class="form-bottom"><small>Demô: príspevky sa ukladajú len v tomto prehliadači.</small><button class="btn" type="submit" ${closed?'disabled':''}>Prihlásiť web</button></div></form></div></section>`;
entries.forEach((e,i)=>app.querySelectorAll('.preview iframe')[i].srcdoc=previewDocument(e.html));app.querySelectorAll('[data-vote]').forEach(b=>b.onclick=()=>vote(b.dataset.vote));app.querySelector('#form').onsubmit=submit;document.getElementById('countdown').textContent=countdown;}
function timeLeft(end){const ms=end-Date.now();if(ms<=0)return'hlasovanie ukončené';return`${Math.floor(ms/86400000)} d ${Math.floor(ms%86400000/3600000)} h ${Math.floor(ms%3600000/60000)} min`}
function vote(id){const end=endAt();if(end&&Date.now()>=end){render();notify('Hlasovanie sa skončilo.');return}const d=read(),k=roundKey();d.votes[k]=d.votes[k]||[];if(d.votes[k].includes(id))return;const e=d.entries.find(x=>x.id===id);if(!e)return;e.votes=(Number(e.votes)||0)+1;d.votes[k].push(id);write(d);render();notify('Hlas bol pridaný.')} 
function submit(ev){ev.preventDefault();const f=new FormData(ev.currentTarget),code=String(f.get('html')).trim();if(!code){notify('Vlož HTML kód alebo vyber súbor.');return}if(new Blob([code]).size>1000000){notify('HTML súbor je príliš veľký. Maximálne 1 MB.');return}if(!/<\s*doctype|<\s*html|<\s*body|<\s*div/i.test(code)){notify('Vlož platný HTML dokument.');return}const d=read(),title=String(f.get('title')).trim(),creator=String(f.get('creator')).trim(),description=String(f.get('description')).trim();let slugValue=slug(title);let n=2;while(d.entries.some(e=>e.slug===slugValue))slugValue=slug(title)+'-'+n++;const rk=roundKey();d.entries.push({id:`site-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,slug:slugValue,title,creator,description,html:code,votes:0,week:rk});if(!write(d)){notify('Nepodarilo sa uložiť súbor.');return}const st=settings();if(!Number(st.endAt)){st.endAt=Date.now()+7*86400000;st.winnerId=null;st.winnerRoundKey=null;st.roundKey=rk;saveSettings(st)}render();notify(`Web bol pridaný: ${title}`);document.getElementById('form').reset();}
addEventListener('popstate',render);render();setInterval(()=>{const el=document.getElementById('countdown'),end=endAt();if(el&&end){el.textContent='Do konca hlasovania: '+timeLeft(end);if(Date.now()>=end)render()}},1000);})();
</script></body></html>
