<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101114"><title>Webová liga — Súťaž o najlepší web</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#191a20;--line:#30313a;--text:#f5f4f1;--muted:#a6a6b0;--lime:#c8fa65;--max:1100px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}button,input,textarea{font:inherit}#toast{position:fixed;right:18px;bottom:18px;transform:translateY(16px);opacity:0;pointer-events:none;transition:all .2s ease;background:#0f172a;border:1px solid var(--line);color:#f8fafc;padding:10px 12px;border-radius:12px;font-size:13px;box-shadow:0 14px 30px rgba(0,0,0,.3)}#toast.show{opacity:1;transform:translateY(0)}.wrap{width:min(var(--max),calc(100% - 32px));margin:auto}.top{border-bottom:1px solid rgba(255,255,255,.08);background:rgba(16,17,20,.9);backdrop-filter:blur(12px);position:sticky;top:0;z-index:20}.nav{display:flex;align-items:center;justify-content:space-between;padding:16px 0}.brand{display:inline-flex;align-items:center;gap:10px;font-weight:900;font-size:18px;letter-spacing:-.04em}.brand i{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--lime);color:#12170d;font-style:normal}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border:0;border-radius:12px;background:var(--lime);color:#101114;font-weight:800;cursor:pointer}.btn.secondary{background:var(--panel);color:var(--text);border:1px solid var(--line)}.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}main.wrap{padding:18px 0 48px}.hero{padding:36px 0 20px}.tag{display:inline-block;padding:6px 10px;border-radius:999px;background:rgba(200,250,101,.08);color:var(--lime);border:1px solid rgba(200,250,101,.25);font-size:12px;font-weight:700;letter-spacing:.04em}.hero h1{margin:18px 0 12px;font-size:clamp(2.2rem,5vw,4.2rem);line-height:.96;letter-spacing:-.06em}.hero h1 span{color:var(--lime)}.hero p{margin:0;color:var(--muted);max-width:760px;font-size:1.03rem}.form-wrap{margin-top:24px;border:1px solid var(--line);background:var(--panel);border-radius:22px;padding:22px;display:grid;gap:14px}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}.field{display:grid;gap:8px}.field label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.field input,.field textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #383c47;background:#12151b;color:var(--text)}.field textarea{min-height:140px;resize:vertical}.upload{display:flex;align-items:center;gap:10px}.upload input{display:none}.countdown{margin-top:12px;color:var(--lime);font-weight:700}.cards{margin-top:22px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{border-radius:18px;background:var(--panel);border:1px solid var(--line);padding:16px;display:grid;gap:10px}.preview{position:relative;border:1px solid var(--line);background:#0c0f14;border-radius:14px;overflow:hidden;height:220px}.preview iframe{width:100%;height:100%;border:0;background:white}.preview::before{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}.card h3{margin:0;font-size:1.02rem}.meta{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:4px}.meta .votes{color:var(--lime);font-weight:800}.meta .author{color:var(--muted);font-size:12px}.actions{display:flex;gap:10px;flex-wrap:wrap}.small{font-size:12px;color:var(--muted)}.section{padding:14px 0 8px}.back{display:inline-flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text)}.detail-wrap{margin-top:18px;display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.detail-info,.detail-side{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}.detail-info h1{margin:10px 0 8px;font-size:clamp(1.8rem,4vw,3rem);line-height:1;letter-spacing:-.05em}.detail-meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px}.detail-preview{margin-top:18px;border:1px solid var(--line);background:#0c0f13;border-radius:14px;overflow:hidden;height:520px}.detail-preview iframe{display:block;width:100%;height:100%;border:0;background:white}.clean-preview{background:#0c0f13}.clean-frame{display:block;width:100%;min-height:100vh;border:0;background:white}.clean-message{min-height:60vh;display:grid;place-items:center;padding:24px;text-align:center;color:var(--text)}.clean-message h1{margin:0 0 8px;font-size:clamp(2rem,7vw,4rem)}.clean-message p{color:var(--muted);max-width:620px}.empty{padding:30px 20px;border:1px dashed var(--line);background:rgba(255,255,255,.01);border-radius:18px;text-align:center;color:var(--muted)}@media (max-width:900px){.grid,.detail-wrap,.cards{grid-template-columns:1fr}.detail-preview{height:420px}.hero{padding-top:18px}}@media (max-width:600px){.nav{padding:12px 0}.brand{font-size:16px}.cards{grid-template-columns:1fr}.card,.detail-info,.detail-side,.form-wrap{padding:14px}}</style>
</head>
<body><header class="top"><div class="wrap nav"><a class="brand" href="./"><i>W</i>webová liga</a><a class="btn" href="./vyherca">🏆 Víťaz</a></div></header><main class="wrap" id="app"></main><div id="toast"></div>
<script>
(() => {
  const DATA='webova-liga-html-v2', SET='webova-liga-settings-v1', REPO='/sutaz-html';
  const forwarded=new URLSearchParams(location.search).get('route');
  if(forwarded) history.replaceState({},'',forwarded);
  const path=location.pathname, base=path===REPO||path.startsWith(REPO+'/')?REPO:'', root=base+'/', app=document.getElementById('app');
  const today=new Date(); today.setHours(0,0,0,0); today.setDate(today.getDate()-((today.getDay()+6)%7));
  const defaultKey=dateKey(today);
  function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
  function read(){try{return JSON.parse(localStorage.getItem(DATA))||{entries:[],votes:{}}}catch{return{entries:[],votes:{}}}}
  function write(d){try{localStorage.setItem(DATA,JSON.stringify(d));return true}catch{return false}}
  function settings(){try{return JSON.parse(localStorage.getItem(SET))||{}}catch{return{}}}
  function saveSettings(s){try{localStorage.setItem(SET,JSON.stringify(s));return true}catch{return false}}
  function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function slug(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,48)||'web'}
  function roundKey(){return settings().roundKey||defaultKey}
  function endAt(){const n=Number(settings().endAt);return Number.isFinite(n)&&n>0?n:null}
  function notify(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
  function route(){let p=location.pathname;if(base&&p.startsWith(base))p=p.slice(base.length);return decodeURIComponent(p.replace(/^\/+|\/+$/g,''))}
  function urlFor(e){return root+encodeURIComponent(e.slug)}

  function previewDocument(html){
    const source=String(html||'').trim();
    const bridge='<scr'+'ipt>(()=>{const closePreview=()=>{try{parent.postMessage({type:"web-liga:close-preview"},"*")}catch(e){}};try{Object.defineProperty(window,"close",{value:closePreview,writable:false,configurable:false})}catch(e){};try{window.onbeforeunload=()=>closePreview();}catch(e){};})();</scr'+'ipt>';
    if(!source)return bridge;
    if(/^<!doctype\s+html/i.test(source))return source.replace(/^<!doctype\s+html[^>]*>/i,m=>m+bridge);
    if(/<head\b/i.test(source))return source.replace(/<head\b[^>]*>/i,m=>m+bridge);
    if(/<body\b/i.test(source))return source.replace(/<body\b[^>]*>/i,m=>m+bridge);
    return bridge+source;
  }
  function showPreviewClosed(frame){frame.srcdoc='<!doctype html><html lang="sk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1220;color:#f8fafc;font-family:system-ui,sans-serif"><div style="padding:24px;text-align:center"><h1 style="margin:0 0 8px;font-size:clamp(2rem,7vw,4rem)">Náhľad bol zatvorený</h1><p style="margin:0;color:#94a3b8">Táto stránka sa zatvorila z bezpečnostných dôvodov.</p></div></body></html>'}
  addEventListener('message',event=>{if(event.data?.type!=='web-liga:close-preview')return;for(const frame of document.querySelectorAll('iframe'))if(frame.contentWindow===event.source){showPreviewClosed(frame);break}});
  function pickWinner(d){const s=settings(),end=endAt();if(s.winnerId&&s.winnerRoundKey===roundKey())return d.entries.find(e=>e.id===s.winnerId)||null;if(!end||Date.now()<end)return null;return d.entries.filter(e=>e.week===roundKey()).sort((a,b)=>(Number(b.votes)||0)-(Number(a.votes)||0))[0]||null}

  function render(){
    const d=read(),r=route(),win=pickWinner(d),end=endAt(),closed=!!end&&Date.now()>=end;
    if(r==='vyherca'){
      document.title=win?`${win.title} — Víťaz`:'Čakáme na víťaza';document.body.classList.add('clean-preview');
      app.innerHTML=win?'<iframe class="clean-frame" title="Čistý náhľad" sandbox="allow-scripts allow-forms allow-popups allow-downloads"></iframe>':'<div class="clean-message"><div><h1>Čakáme na víťaza</h1><p>Po skončení kola sa tu zobrazí víťazný web.</p></div></div>';
      if(win)app.querySelector('iframe').srcdoc=previewDocument(win.html);return;
    }
    const requested=r?d.entries.find(e=>e.slug===r):null,isClean=new URLSearchParams(location.search).get('preview')==='1';
    if(isClean){
      document.body.classList.add('clean-preview');
      if(!requested){document.title='Náhľad nie je dostupný';app.innerHTML='<div class="clean-message"><div><h1>Náhľad nie je dostupný</h1><p>Tento web sa nenašiel v úložisku tohto prehliadača.</p></div></div>';return;}
      document.title=requested.title;app.innerHTML='<iframe class="clean-frame" title="Čistý náhľad" sandbox="allow-scripts allow-forms allow-popups allow-downloads"></iframe>';app.querySelector('iframe').srcdoc=previewDocument(requested.html);return;
    }
    document.body.classList.remove('clean-preview');
    if(requested){
      document.title=requested.title+' — Webová liga';
      app.innerHTML=`<section class="section"><a class="back" href="${root}">← Späť na súťaž</a><div class="detail-wrap"><div class="detail-info"><div class="tag">HTML web</div><h1>${esc(requested.title)}</h1><div class="detail-meta"><span>${esc(requested.creator||'Neznámy autor')}</span><span>•</span><span>${esc(requested.week||roundKey())}</span></div><div class="actions" style="margin-top:16px"><button class="btn" data-vote>🗳️ Hlasovať</button><a class="btn secondary" href="?preview=1" target="_blank" rel="noopener">👀 Náhľad</a><a class="btn secondary" href="${root}${requested.slug}" target="_blank" rel="noopener">🔗 Otvoriť odkaz</a></div></div><div class="detail-side"><div class="small">Počet hlasov</div><div style="font-size:2rem;font-weight:900;margin-top:6px">${Number(requested.votes)||0}</div><div class="small" style="margin-top:10px">Kolo: ${esc(requested.week||roundKey())}</div></div></div><div class="detail-preview"><iframe title="Náhľad webu" sandbox="allow-scripts allow-forms allow-popups allow-downloads"></iframe></div></div></section>`;
      app.querySelector('.detail-preview iframe').srcdoc=previewDocument(requested.html);app.querySelector('[data-vote]').onclick=()=>vote(requested.id);return;
    }
    const entries=d.entries.filter(e=>e.week===roundKey()).sort((a,b)=>(Number(b.votes)||0)-(Number(a.votes)||0));
    const countdown=end?'Do konca hlasovania: '+timeLeft(end):'Časovač sa spustí po prihlásení prvého webu';
    app.innerHTML=`<section class="hero"><div class="tag">● Týždenná súťaž webov</div><h1>Vlož svoj web.<br><span>Vyhraj týždeň.</span></h1><p>Prihlás HTML projekt, nechaj komunitu hlasovať a zisti, kto vytvorí najlepší zážitok.</p><div class="countdown" id="countdown">${countdown}</div></section><section class="form-wrap"><form id="form"><div class="grid"><div class="field"><label for="title">Názov webu</label><input id="title" name="title" required maxlength="80" placeholder="Napr. Môj super web"></div><div class="field"><label for="creator">Autor / tím</label><input id="creator" name="creator" maxlength="60" placeholder="Napr. Marika, UX Lab"></div></div><div class="field" style="margin-top:8px"><label for="html">HTML kód</label><textarea id="html" name="html" placeholder="Vlož HTML kód alebo nahraj súbor..." required></textarea></div><div class="upload"><label class="btn secondary" for="file">📁 Vybrať súbor</label><input id="file" type="file" accept=".html,.htm,text/html"/><span class="small">Max. 1 MB</span></div><button class="btn" type="submit">📤 Pridať web</button></form></section>${entries.length?`<section class="cards">${entries.map(e=>`<article class="card"><div class="preview"><iframe title="Náhľad ${esc(e.title)}" sandbox="allow-scripts allow-forms allow-popups allow-downloads"></iframe></div><div class="meta"><h3>${esc(e.title)}</h3><div class="votes">${Number(e.votes)||0} hlasov</div></div><div class="meta"><span class="author">${esc(e.creator||'Neznámy autor')}</span><div class="actions"><a class="btn secondary" href="${root}${e.slug}">Otvoriť</a><button class="btn" data-vote data-id="${e.id}">Hlasovať</button></div></div></article>`).join('')}</section>`:'<div class="empty">Ešte nie je prihlásený žiadny web. Buď prvý.</div>'}`;
    entries.forEach((e,i)=>app.querySelectorAll('.preview iframe')[i].srcdoc=previewDocument(e.html));
    app.querySelector('#file').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;if(f.size>1000000){notify('HTML súbor môže mať najviac 1 MB.');ev.target.value='';return}app.querySelector('#html').value=await f.text();notify('Súbor bol načítaný.');};
    app.querySelector('#form').onsubmit=submit;
    app.querySelectorAll('[data-vote]').forEach(el=>{const id=el.dataset.id; if(id) el.onclick=()=>vote(id);});
  }
  function timeLeft(end){const ms=end-Date.now();if(ms<=0)return'hlasovanie ukončené';return`${Math.floor(ms/86400000)} d ${Math.floor(ms%86400000/3600000)} h ${Math.floor(ms%3600000/60000)} min`}
  function vote(id){const end=endAt();if(end&&Date.now()>=end){render();notify('Hlasovanie sa skončilo.');return}const d=read(),k=roundKey();d.votes[k]=d.votes[k]||[];if(d.votes[k].includes(id)){notify('Tento web si už ohodnotil.');return}d.votes[k].push(id);d.entries=d.entries.map(e=>e.id===id?{...e,votes:(Number(e.votes)||0)+1}:e);write(d);render();notify('Hlas bol pridaný.');}
  function submit(ev){ev.preventDefault();const f=new FormData(ev.currentTarget),title=String(f.get('title')||'').trim(),creator=String(f.get('creator')||'').trim(),html=String(f.get('html')||'').trim();if(!title||!html){notify('Vyplň názov a HTML kód.');return}if(!/^<!doctype\s+html|<html|<body|<[a-zA-Z][\w-]*\b/i.test(html)){notify('HTML musí obsahovať platný web.');return}const d=read(),k=roundKey(),entry={id:`web-${Date.now()}-${Math.random().toString(16).slice(2)}`,title,creator,html,slug:slug(title)+'-'+Math.random().toString(36).slice(2,7),votes:0,week:k,createdAt:Date.now()};d.entries.push(entry);write(d);ev.currentTarget.reset();render();notify('Web bol prihlásený.');}
  addEventListener('popstate',render);render();setInterval(()=>{const el=document.getElementById('countdown'),end=endAt();if(el&&end){el.textContent='Do konca hlasovania: '+timeLeft(end);if(Date.now()>=end){render();}}},1000*30)}();
</script></body></html>
