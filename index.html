<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101114"><title>Webová liga — Súťaž o najlepší web</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#191a20;--line:#30313a;--text:#f5f4f1;--muted:#a6a6b0;--lime:#c8fa65;--max:1100px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(var(--max),calc(100% - 36px));margin:auto}.top{height:70px;border-bottom:1px solid #ffffff15;display:flex;align-items:center}.nav{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:850;font-size:19px;text-decoration:none;letter-spacing:-.05em}.brand i{font-style:normal;background:var(--lime);color:#171912;border-radius:9px;padding:5px 9px;margin-right:8px}.navlink,.btn{border:0;border-radius:999px;background:var(--lime);color:#171912;font-weight:800;text-decoration:none;padding:10px 16px;cursor:pointer;display:inline-block}.btn.secondary{background:#33343a;color:white}.btn.danger{background:#512d31;color:#ffd9dc}.hero{padding:60px 0 35px}.tag{color:var(--lime);font-weight:800;font-size:12px;letter-spacing:.13em;text-transform:uppercase}.hero h1{font-size:clamp(43px,8vw,72px);letter-spacing:-.075em;line-height:.98;margin:15px 0}.hero h1 span{color:var(--lime)}.hero p,.muted{color:var(--muted)}.hero p{max-width:620px;font-size:16px}.section{padding:32px 0 52px}.heading{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:19px}.heading h2{font-size:clamp(27px,4vw,38px);line-height:1.05;letter-spacing:-.055em;margin:7px 0 0}.muted{font-size:13px}.entries{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}.preview{display:block;height:210px;background:#22232a;position:relative}.preview iframe{display:block;border:0;width:100%;height:100%;background:#fff;pointer-events:none}.rank{position:absolute;top:10px;left:10px;background:#101114df;border-radius:8px;padding:4px 9px;font-size:12px;font-weight:800;z-index:1;pointer-events:none}.details{padding:15px}.details h3{margin:0;font-size:19px}.author,.desc{font-size:13px}.author{color:var(--muted)}.desc{color:#c5c5cc;min-height:38px}.card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid #ffffff14;padding-top:12px;flex-wrap:wrap}.vote{padding:8px 12px}.vote:disabled{background:#32333a;color:#ddd;cursor:default}.route-link{color:var(--lime);font-size:12px;text-decoration:none;font-weight:700}.empty{grid-column:1/-1;border:1px dashed #454650;border-radius:18px;padding:35px;text-align:center;color:var(--muted)}.empty b{display:block;color:white}.submit{background:#16171b;border-top:1px solid #ffffff12;padding:50px 0}.submit-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:34px;align-items:start}.submit h2{font-size:clamp(34px,5vw,48px);line-height:1;letter-spacing:-.06em;margin:12px 0}.submit-copy p{color:var(--muted)}.form{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:21px}.form h3{margin:0}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:13px;font-weight:700}.field input,.field textarea{width:100%;border:1px solid #383941;border-radius:10px;background:#111216;color:white;padding:11px;outline:none;font:inherit}.field input:focus,.field textarea:focus{border-color:var(--lime)}.field textarea{min-height:190px;resize:vertical;font:13px/1.5 ui-monospace,Consolas,monospace}.help{font-size:11px;color:var(--muted)}.form-bottom{display:flex;justify-content:space-between;align-items:center;gap:14px}.form-bottom small{color:var(--muted);font-size:11px}.winner{padding:38px 0}.winner-box{border:1px solid #c8fa6540;background:#1c2118;border-radius:18px;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:15px}.winner-box h3{margin:0}.winner-box p{margin:3px 0;color:var(--muted);font-size:13px}.detail-preview{height:min(75vh,800px);min-height:420px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:white}.detail-preview iframe{width:100%;height:100%;border:0;background:white}.detail-info{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:18px 0}.detail-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.back{color:var(--lime);text-decoration:none;font-weight:700}.footer{border-top:1px solid #ffffff12;padding:22px 0;color:var(--muted);font-size:12px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#f4f3ef;color:#171815;border-radius:10px;padding:12px 16px;font-weight:750;transition:.2s;z-index:4}.toast.show{opacity:1;transform:translate(-50%,0)}body.clean-preview{overflow:hidden;background:white}body.clean-preview .top,body.clean-preview .footer{display:none}body.clean-preview #app{width:100%;max-width:none;margin:0}body.clean-preview .clean-frame{display:block;width:100%;height:100dvh;border:0;background:white}body.clean-preview .clean-loading{position:fixed;top:10px;left:10px;background:#171815;color:white;padding:6px 10px;border-radius:8px;font-size:12px;z-index:-1}@media(max-width:750px){.submit-grid{grid-template-columns:1fr}.hero{padding-top:45px}.heading{align-items:flex-start;flex-direction:column}.detail-preview{min-height:340px}}@media(max-width:480px){.wrap{width:calc(100% - 26px)}.form{padding:16px}.form-bottom{align-items:flex-start;flex-direction:column}.preview{height:185px}.winner-box{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header class="top"><div class="wrap nav"><a class="brand" href="./"><i>W</i>webová liga</a><a class="navlink" href="#prihlasit">Prihlásiť HTML ↗</a></div></header>
<main class="wrap" id="app"></main><footer class="footer"><div class="wrap">© <span id="year"></span> Webová liga · Súťaž o najlepší web.</div></footer><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
const KEY='webova-liga-html-v2', REPO='/sutaz-html';let path=location.pathname;
// GitHub Pages forwards unknown paths here through 404.html.
const forwarded=new URLSearchParams(location.search).get('route');if(forwarded)history.replaceState({},'',forwarded);
path=location.pathname;const base=path===REPO||path.startsWith(REPO+'/')?REPO:'',root=base+'/',app=document.getElementById('app');
document.getElementById('year').textContent=new Date().getFullYear();const now=new Date(),monday=new Date(now);monday.setHours(0,0,0,0);monday.setDate(monday.getDate()-((monday.getDay()+6)%7));const next=new Date(monday);next.setDate(next.getDate()+7);const week=`${monday.getFullYear()}-${String(monday.getMonth()+1).padStart(2,'0')}-${String(monday.getDate()).padStart(2,'0')}`;
const slug=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,48)||'web';
const data=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{entries:[],votes:{}}}catch{return{entries:[],votes:{}}}},save=d=>{try{localStorage.setItem(KEY,JSON.stringify(d));return true}catch{return false}},esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2700)}
function routeFor(e){return root+encodeURIComponent(e.slug)}
function currentSlug(){let p=location.pathname;if(base&&p.startsWith(base))p=p.slice(base.length);return decodeURIComponent(p.replace(/^\/+|\/+$/g,''))}
function removeSite(id){const password=prompt('Zadaj 4-miestne heslo na vymazanie:');if(password===null)return;if(password!=='4321'){toast('Nesprávne heslo.');return}if(!confirm('Naozaj chceš tento web natrvalo vymazať z tohto prehliadača?'))return;const d=data();d.entries=d.entries.filter(e=>e.id!==id);Object.keys(d.votes||{}).forEach(w=>{d.votes[w]=(d.votes[w]||[]).filter(v=>v!==id)});if(!save(d)){toast('Web sa nepodarilo vymazať.');return}history.pushState({},'',root);render();toast('Web bol vymazaný.')}
function render(){const d=data(),s=currentSlug(),all=d.entries,selected=s?all.find(e=>e.slug===s):null,clean=new URLSearchParams(location.search).get('preview')==='1';
if(s&&selected){document.title=`${selected.title} — Webová liga`;if(clean){document.body.classList.add('clean-preview');app.innerHTML='<iframe class="clean-frame" title="Čistý náhľad webu" sandbox="allow-scripts allow-forms allow-popups"></iframe>';app.querySelector('iframe').srcdoc=selected.html;return}document.body.classList.remove('clean-preview');app.innerHTML=`<section class="section"><a class="back" href="${root}" data-home>← Späť na súťaž</a><div class="detail-info"><div><div class="tag">HTML web v súťaži</div><h1 style="font-size:clamp(32px,6vw,56px);letter-spacing:-.06em;line-height:1.05;margin:10px 0 3px">${esc(selected.title)}</h1><div class="muted">od ${esc(selected.creator)} · ${selected.votes} hlasov</div><p class="muted">${esc(selected.description)}</p></div><div class="detail-actions"><a class="btn secondary" href="${routeFor(selected)}?preview=1" target="_blank" rel="noopener">Čistý náhľad ↗</a><button class="btn danger" data-delete="${esc(selected.id)}">Zmazať</button><button class="btn vote" data-vote="${esc(selected.id)}" ${d.votes[week]?.includes(selected.id)?'disabled':''}>${d.votes[week]?.includes(selected.id)?'✓ Hlasovan��':'Hlasovať'}</button></div></div><div class="detail-preview"><iframe title="HTML náhľad: ${esc(selected.title)}" sandbox="allow-scripts allow-forms allow-popups"></iframe></div></section>`;app.querySelector('.detail-preview iframe').srcdoc=selected.html;app.querySelector('[data-home]').onclick=e=>{e.preventDefault();history.pushState({},'',root);render();scrollTo(0,0)};app.querySelector('[data-vote]').onclick=()=>vote(selected.id);app.querySelector('[data-delete]').onclick=()=>removeSite(selected.id);return}
document.body.classList.remove('clean-preview');document.title='Webová liga — Súťaž o najlepší web';const entries=all.filter(e=>e.week===week).sort((a,b)=>b.votes-a.votes),weekNo=Math.floor((Date.UTC(monday.getFullYear(),monday.getMonth(),monday.getDate())-Date.UTC(monday.getFullYear(),0,1))/604800000)+1;
app.innerHTML=`<section class="hero"><div class="tag">● Týždenná súťaž webov</div><h1>Vlož svoj web.<br><span>Vyhraj týždeň.</span></h1><p>Vlož HTML kód svojho webu. Komunita zahlasuje a najlepší projekt získa titul víťaza týždňa.</p><a class="btn" href="#sutaz">Pozrieť súťaž ↓</a></section><section class="section" id="sutaz"><div class="heading"><div><div class="tag">Kolo ${weekNo} · hlasovanie</div><h2>Weby v súťaži</h2></div><div class="muted" id="countdown"></div></div><div class="entries">${entries.length?entries.map((e,i)=>`<article class="card"><a class="preview" href="${routeFor(e)}" aria-label="Otvoriť náhľad ${esc(e.title)}"><span class="rank">#${String(i+1).padStart(2,'0')}</span><iframe title="Náhľad ${esc(e.title)}" sandbox="allow-scripts allow-forms allow-popups" loading="lazy" tabindex="-1"></iframe></a><div class="details"><h3>${esc(e.title)}</h3><div class="author">od ${esc(e.creator)}</div><p class="desc">${esc(e.description)}</p><div class="card-foot"><span class="muted"><b>${e.votes}</b> hlasov</span><a class="route-link" href="${routeFor(e)}">Otvoriť /${esc(e.slug)} ↗</a><button class="btn secondary" data-clean="${esc(e.id)}">Čistý náhľad</button><button class="btn vote" data-vote="${esc(e.id)}" ${d.votes[week]?.includes(e.id)?'disabled':''}>${d.votes[week]?.includes(e.id)?'✓':'Hlasovať'}</button><button class="btn danger" data-delete="${esc(e.id)}">Zmazať</button></div></div></article>`).join(''):'<div class="empty"><b>Zatiaľ tu nie sú žiadne weby.</b>Buď prvý a prihlás svoj HTML projekt!</div>'}</div></section><section class="submit" id="prihlasit"><div class="submit-grid"><div class="submit-copy"><div class="tag">Tvoríš niečo super?</div><h2>Prihlás svoj HTML web.</h2><p>Vlož HTML dokument alebo nahraj súbor .html. Každý projekt dostane vlastnú cestu v tvare <b>/nazov-stranky</b>.</p><p class="muted">Náhľad sa otvorí oddelene od stránky súťaže.</p></div><form class="form" id="form"><h3>Nový súťažný web</h3><div class="field"><label for="title">Názov projektu *</label><input id="title" name="title" required maxlength="50" placeholder="Napríklad: Moje portfólio"></div><div class="field"><label for="creator">Tvorca alebo tím *</label><input id="creator" name="creator" required maxlength="40" placeholder="Tvoje meno alebo tím"></div><div class="field"><label for="description">Krátke predstavenie *</label><input id="description" name="description" required maxlength="120" placeholder="Čím je tvoj web výnimočný?"></div><div class="field"><label for="html">HTML kód *</label><textarea id="html" name="html" maxlength="100000" placeholder="<!doctype html>\n<html>\n  ...\n</html>"></textarea><span class="help">Vlož celý kód. Najviac 100 KB. JavaScript v náhľade je zapnutý v izolovanom náhľade.</span></div><div class="field"><label for="file">Alebo nahraj súbor .html</label><input id="file" type="file" accept=".html,.htm,text/html"><span class="help" id="file-name">Súbor sa načíta do poľa HTML kódu.</span></div><div class="form-bottom"><small>Demo: príspevky a hlasy sa ukladajú iba v tomto prehliadači. Heslo na mazanie 4321 nie je bezpečné pre verejnú produkciu.</small><button class="btn" type="submit">Prihlásiť web ↗</button></div></form></div></section><section class="winner"><div class="heading"><div><div class="tag">Na hlavnej stránke</div><h2>Víťaz minulého kola</h2></div></div><div class="winner-box" id="winner"><div><h3>Zatiaľ čakáme na prvého víťaza 🏆</h3><p>Víťaz sa zobrazí po skončení hlasovania.</p></div></div></section>`;
entries.forEach((e,i)=>{app.querySelectorAll('.preview iframe')[i].srcdoc=e.html});app.querySelectorAll('[data-vote]').forEach(b=>b.onclick=()=>vote(b.dataset.vote));app.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>removeSite(b.dataset.delete));app.querySelectorAll('[data-clean]').forEach(b=>b.onclick=()=>{const e=data().entries.find(x=>x.id===b.dataset.clean);if(e)window.open(routeFor(e)+'?preview=1','_blank','noopener')});app.querySelector('#file').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;if(f.size>100000){toast('HTML súbor môže mať najviac 100 KB.');ev.target.value='';return}app.querySelector('#html').value=await f.text();app.querySelector('#file-name').textContent=`Načítané: ${f.name}`};app.querySelector('#form').onsubmit=submit;updateWinner(d);tick()}
function vote(id){const d=data();d.votes[week]=d.votes[week]||[];if(d.votes[week].includes(id))return;const e=d.entries.find(x=>x.id===id);if(!e)return;e.votes++;d.votes[week].push(id);if(!save(d)){toast('Nepodarilo sa uložiť hlas.');return}render();toast('Tvoj hlas je započítaný!')}
function submit(ev){ev.preventDefault();const f=new FormData(ev.currentTarget),code=String(f.get('html')).trim();if(!code){toast('Vlož HTML kód alebo nahraj .html súbor.');return}if(new Blob([code]).size>100000){toast('HTML kód môže mať najviac 100 KB.');return}if(!/<\s*(html|!doctype|body|div|main|section)\b/i.test(code)){toast('Vlož platný HTML kód stránky.');return}const d=data(),title=String(f.get('title')).trim();let s=slug(title),n=2;while(d.entries.some(e=>e.slug===s))s=`${slug(title)}-${n++}`;d.entries.push({id:`site-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,slug:s,title,creator:String(f.get('creator')).trim(),description:String(f.get('description')).trim(),html:code,votes:0,week});if(!save(d)){toast('Uloženie zlyhalo. Skús menší HTML kód.');return}render();toast(`Web pridaný! Jeho cesta je /${s}`);document.getElementById('sutaz').scrollIntoView({behavior:'smooth'})}
function updateWinner(d){const prev=new Date(monday);prev.setDate(prev.getDate()-7);const key=`${prev.getFullYear()}-${String(prev.getMonth()+1).padStart(2,'0')}-${String(prev.getDate()).padStart(2,'0')}`,e=d.entries.filter(x=>x.week===key).sort((a,b)=>b.votes-a.votes)[0];if(e){const w=document.getElementById('winner');if(w)w.innerHTML=`<div><h3>🏆 ${esc(e.title)} — ${esc(e.creator)}</h3><p>Víťaz minulého kola · ${e.votes} hlasov</p></div><a class="route-link" href="${routeFor(e)}">Pozrieť web ↗</a>`}}
function tick(){const el=document.getElementById('countdown');if(!el)return;const ms=next-Date.now();el.textContent=`Hlasovanie končí o ${Math.floor(ms/86400000)} d ${Math.floor(ms%86400000/3600000)} h ${Math.floor(ms%3600000/60000)} min`}
addEventListener('popstate',render);render();setInterval(tick,60000);
})();
</script></body></html>
